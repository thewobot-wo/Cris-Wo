<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cris Wo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .name {
            font-size: 2rem;
            font-weight: 200;
            color: #888888;
            text-align: center;
            cursor: pointer;
            position: relative;
            letter-spacing: 0.5em;
            transition: all 0.3s ease;
        }

        .name:hover {
            color: #ffffff;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.5),
                0 0 20px rgba(255, 255, 255, 0.3),
                0 0 30px rgba(255, 255, 255, 0.2);
            animation: glow 2s ease-in-out infinite alternate;
        }

        .name.clicked {
            animation: none;
        }

        .name.mobile-glow-fade {
            animation: glowFadeOut 2s ease-out forwards;
        }

        @keyframes glowFadeOut {
            0% {
                color: #ffffff;
                text-shadow: 
                    0 0 10px rgba(255, 255, 255, 0.5),
                    0 0 20px rgba(255, 255, 255, 0.3),
                    0 0 30px rgba(255, 255, 255, 0.2);
            }
            100% {
                color: #888888;
                text-shadow: none;
            }
        }

        /* Mobile-specific styles */
        @media (max-width: 768px) {
            .name:hover {
                animation: none;
            }
        }

        .particle {
            position: absolute;
            font-size: 12px;
            color: #ffffff;
            pointer-events: none;
            z-index: 1000;
            animation: floatUp 2s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) translateX(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) translateX(var(--drift, 0px));
            }
        }

        @keyframes glow {
            0% {
                text-shadow: 
                    0 0 10px rgba(255, 255, 255, 0.5),
                    0 0 20px rgba(255, 255, 255, 0.3),
                    0 0 30px rgba(255, 255, 255, 0.2);
            }
            100% {
                text-shadow: 
                    0 0 15px rgba(255, 255, 255, 0.8),
                    0 0 25px rgba(255, 255, 255, 0.5),
                    0 0 35px rgba(255, 255, 255, 0.3);
            }
        }

        /* Fallback for browsers that don't support background-clip: text */
        @supports not (background-clip: text) {
            .name {
                color: #888888;
                background: none;
                -webkit-text-fill-color: initial;
            }
            
            .name:hover {
                color: #ffffff;
                text-shadow: 
                    0 0 10px rgba(255, 255, 255, 0.5),
                    0 0 20px rgba(255, 255, 255, 0.3),
                    0 0 30px rgba(255, 255, 255, 0.2);
                animation: glow 2s ease-in-out infinite alternate;
            }
        }
    </style>
</head>
<body>
    <div class="name" id="name">Cris Wo</div>

    <script>
        document.getElementById('name').addEventListener('click', function(e) {
            const nameElement = this;
            
            // Check if mobile
            const isMobile = window.innerWidth <= 768;
            
            // Create musical symbol particles
            const rect = this.getBoundingClientRect();
            
            // Define all musical symbols
            const symbols = [
                '♫', '♪', '♫', '♪', '♫', '♪', '♫', '♪', // 8 eighth notes (4 single, 4 double)
                '𝄞', '𝄞', '𝄞', // 3 treble clefs
                '𝄢', '𝄢' // 2 bass clefs
            ];
            
            // On mobile, start with glow effect
            if (isMobile) {
                nameElement.style.color = '#ffffff';
                nameElement.style.textShadow = '0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 255, 255, 0.3), 0 0 30px rgba(255, 255, 255, 0.2)';
            }
            
            for (let i = 0; i < symbols.length; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.innerHTML = symbols[i];
                
                // Random position around the text with better spread
                const x = rect.left + (rect.width / 2) + (Math.random() - 0.5) * 150;
                const y = rect.top + (rect.height / 2) + (Math.random() - 0.5) * 40;
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                // Random horizontal drift with better spread
                const drift = (Math.random() - 0.5) * 80;
                particle.style.setProperty('--drift', drift + 'px');
                
                document.body.appendChild(particle);
                
                // Remove particle after animation
                setTimeout(() => {
                    if (particle.parentNode) {
                        particle.parentNode.removeChild(particle);
                    }
                }, 2000);
            }
            
            // On mobile, fade out glow as music disappears
            if (isMobile) {
                setTimeout(() => {
                    nameElement.classList.add('mobile-glow-fade');
                    setTimeout(() => {
                        nameElement.classList.remove('mobile-glow-fade');
                    }, 2000);
                }, 100);
            }
        });
    </script>
</body>
</html>
