<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cris Wo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .name {
            font-size: 2rem;
            font-weight: 200;
            color: #888888;
            text-align: center;
            cursor: pointer;
            position: relative;
            letter-spacing: 0.5em;
            transition: all 0.3s ease;
        }

        .name:hover {
            color: #ffffff;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.5),
                0 0 20px rgba(255, 255, 255, 0.3),
                0 0 30px rgba(255, 255, 255, 0.2);
            animation: glow 2s ease-in-out infinite alternate;
        }

        .name.clicked {
            animation: none;
        }

        .name.flash {
            animation: flashEffect 0.3s ease-out;
        }

        @keyframes flashEffect {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.8);
            }
            50% {
                box-shadow: 0 0 20px 10px rgba(255, 255, 255, 0.4);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }


        /* Mobile-specific styles */
        @media (max-width: 768px) {
            .name:hover {
                animation: none;
            }
        }

        .particle {
            position: absolute;
            font-size: 12px;
            color: #ffffff;
            pointer-events: none;
            z-index: 1000;
            animation: floatUp 2s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) translateX(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) translateX(var(--drift, 0px));
            }
        }

        @keyframes glow {
            0% {
                text-shadow: 
                    0 0 10px rgba(255, 255, 255, 0.5),
                    0 0 20px rgba(255, 255, 255, 0.3),
                    0 0 30px rgba(255, 255, 255, 0.2);
            }
            100% {
                text-shadow: 
                    0 0 15px rgba(255, 255, 255, 0.8),
                    0 0 25px rgba(255, 255, 255, 0.5),
                    0 0 35px rgba(255, 255, 255, 0.3);
            }
        }

        /* Fallback for browsers that don't support background-clip: text */
        @supports not (background-clip: text) {
            .name {
                color: #888888;
                background: none;
                -webkit-text-fill-color: initial;
            }
            
            .name:hover {
                color: #ffffff;
                text-shadow: 
                    0 0 10px rgba(255, 255, 255, 0.5),
                    0 0 20px rgba(255, 255, 255, 0.3),
                    0 0 30px rgba(255, 255, 255, 0.2);
                animation: glow 2s ease-in-out infinite alternate;
            }
        }
    </style>
</head>
<body>
    <div class="name" id="name">Cris Wo</div>

    <script>
        document.getElementById('name').addEventListener('click', function(e) {
            const nameElement = this;
            
            // Add flash effect immediately on click
            nameElement.classList.add('flash');
            setTimeout(() => {
                nameElement.classList.remove('flash');
            }, 300);
            
            // Check if mobile
            const isMobile = window.innerWidth <= 768;
            
            // Create musical symbol particles
            const rect = this.getBoundingClientRect();
            
            // Define all musical symbols
            const symbols = [
                '♫', '♪', '♫', '♪', '♫', '♪', '♫', '♪', // 8 eighth notes (4 single, 4 double)
                '𝄞', '𝄞', '𝄞', // 3 treble clefs
                '𝄢', '𝄢' // 2 bass clefs
            ];
            
            // On mobile, start with glow effect
            if (isMobile) {
                nameElement.style.color = '#ffffff';
                nameElement.style.textShadow = '0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 255, 255, 0.3), 0 0 30px rgba(255, 255, 255, 0.2)';
            }
            
            for (let i = 0; i < symbols.length; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.innerHTML = symbols[i];
                
                // Random position around the text with better spread
                const x = rect.left + (rect.width / 2) + (Math.random() - 0.5) * 150;
                const y = rect.top + (rect.height / 2) + (Math.random() - 0.5) * 40;
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                // Random horizontal drift with better spread
                const drift = (Math.random() - 0.5) * 80;
                particle.style.setProperty('--drift', drift + 'px');
                
                document.body.appendChild(particle);
                
                // Remove particle after animation
                setTimeout(() => {
                    if (particle.parentNode) {
                        particle.parentNode.removeChild(particle);
                    }
                }, 2000);
            }
            
            // On mobile, fade out glow as music disappears
            if (isMobile) {
                // Start fade animation after a brief delay
                setTimeout(() => {
                    const startTime = Date.now();
                    const duration = 2000; // 2 seconds
                    
                    const fadeOut = () => {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        
                        // Ease-out function
                        const easeOut = 1 - Math.pow(1 - progress, 3);
                        
                        // Fade from white to light gray
                        const colorProgress = 1 - easeOut;
                        const r = Math.round(136 + (255 - 136) * colorProgress);
                        const g = Math.round(136 + (255 - 136) * colorProgress);
                        const b = Math.round(136 + (255 - 136) * colorProgress);
                        
                        nameElement.style.color = `rgb(${r}, ${g}, ${b})`;
                        
                        // Fade out text shadow
                        const shadowOpacity = 0.5 * (1 - easeOut);
                        nameElement.style.textShadow = `0 0 10px rgba(255, 255, 255, ${shadowOpacity}), 0 0 20px rgba(255, 255, 255, ${shadowOpacity * 0.6}), 0 0 30px rgba(255, 255, 255, ${shadowOpacity * 0.4})`;
                        
                        if (progress < 1) {
                            requestAnimationFrame(fadeOut);
                        } else {
                            // Ensure final state
                            nameElement.style.color = '#888888';
                            nameElement.style.textShadow = 'none';
                        }
                    };
                    
                    requestAnimationFrame(fadeOut);
                }, 100);
            }
        });
    </script>
</body>
</html>
